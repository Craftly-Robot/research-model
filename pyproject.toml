[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "craftly-client"
version = "1.0.0"
description = "Authenticated SDK and CLI for the Craftly Training Workspace"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
]

[project.scripts]
craftly = "src.craftly.training_client:main"

[tool.setuptools]
packages = ["src", "src.craftly"]
py-modules = ["craftly_client"]
