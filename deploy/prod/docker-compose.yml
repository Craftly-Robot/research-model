services:
  migrator:
    build:
      context: ../..
      dockerfile: Dockerfile
    command: ["python", "-m", "src.craftly.db.migration_runner"]
    environment:
      CRAFTLY_DATABASE_URL: "postgresql://craftly:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/craftly"
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    environment:
      CRAFTLY_ENV: "production"
      CRAFTLY_AUTH_ENABLED: "1"
      CRAFTLY_QUOTA_ENABLED: "1"
      CRAFTLY_JWT_SECRET: "${CRAFTLY_JWT_SECRET:?set CRAFTLY_JWT_SECRET}"
      CRAFTLY_WORKSPACE_BOOTSTRAP_TOKEN: "${CRAFTLY_WORKSPACE_BOOTSTRAP_TOKEN:?set CRAFTLY_WORKSPACE_BOOTSTRAP_TOKEN}"
      CRAFTLY_ALLOW_TOKEN_ISSUE: "0"
      CRAFTLY_DATABASE_URL: "postgresql://craftly:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/craftly"
      CRAFTLY_REDIS_URL: "redis://redis:6379/0"
      CRAFTLY_QDRANT_URL: "http://qdrant:6333"
      CRAFTLY_EMBEDDING_URL: "${CRAFTLY_EMBEDDING_URL:?set CRAFTLY_EMBEDDING_URL}"
      CRAFTLY_OBJECT_STORE_URI: "s3://craftly-datasets/training-workspace"
      CRAFTLY_OBJECT_STORE_ENDPOINT_URL: "http://minio:9000"
      CRAFTLY_OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318/v1/traces"
      AWS_ACCESS_KEY_ID: "${MINIO_ROOT_USER:?set MINIO_ROOT_USER}"
      AWS_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}"
      AWS_EC2_METADATA_DISABLED: "true"
      CRAFTLY_TRAINING_GIT_COMMIT: "${CRAFTLY_TRAINING_GIT_COMMIT:?set CRAFTLY_TRAINING_GIT_COMMIT}"
      CRAFTLY_TRAINING_IMAGE_DIGEST: "${CRAFTLY_TRAINING_IMAGE_DIGEST:?set CRAFTLY_TRAINING_IMAGE_DIGEST}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health/ready', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      default:
        aliases: ["craftly-api"]
  training-workspace-ui:
    build:
      context: ../..
      dockerfile: apps/training-workspace/Dockerfile
    profiles: ["training"]
    restart: unless-stopped
    ports:
      - "8088:8080"
    depends_on:
      api:
        condition: service_healthy
  training-controller:
    build:
      context: ../..
      dockerfile: Dockerfile
    profiles: ["training"]
    command: ["python", "-u", "-m", "src.craftly.training_workspace", "controller", "--poll-seconds", "5"]
    restart: unless-stopped
    environment:
      CRAFTLY_ENV: "production"
      CRAFTLY_JWT_SECRET: "${CRAFTLY_JWT_SECRET:?set CRAFTLY_JWT_SECRET}"
      CRAFTLY_DATABASE_URL: "postgresql://craftly:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/craftly"
      CRAFTLY_REDIS_URL: "redis://redis:6379/0"
      CRAFTLY_OBJECT_STORE_URI: "s3://craftly-datasets/training-workspace"
      CRAFTLY_OBJECT_STORE_ENDPOINT_URL: "http://minio:9000"
      AWS_ACCESS_KEY_ID: "${MINIO_ROOT_USER:?set MINIO_ROOT_USER}"
      AWS_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}"
      AWS_EC2_METADATA_DISABLED: "true"
      CRAFTLY_TRAINING_GIT_COMMIT: "${CRAFTLY_TRAINING_GIT_COMMIT:?set CRAFTLY_TRAINING_GIT_COMMIT}"
      CRAFTLY_TRAINING_IMAGE_DIGEST: "${CRAFTLY_TRAINING_IMAGE_DIGEST:?set CRAFTLY_TRAINING_IMAGE_DIGEST}"
    volumes:
      - training-runtime:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
      migrator:
        condition: service_completed_successfully
  crawler-worker:
    build:
      context: ../..
      dockerfile: Dockerfile
    profiles: ["data"]
    command: ["python", "-m", "src.craftly.learning.worker"]
    environment:
      CRAFTLY_DATABASE_URL: "postgresql://craftly:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/craftly"
      CRAFTLY_DATA_SOURCES: "config/data_sources.ultimate.json"
      CRAFTLY_RAW_OUTPUT_DIR: "/data/raw"
      CRAFTLY_CLEAN_OUTPUT_DIR: "/data/clean"
      CRAFTLY_ASYNC_WORKERS: "32"
      CRAFTLY_BATCH_DOCS: "10000"
      CRAFTLY_WORKER_LOOPS: "100"
    volumes:
      - data-artifacts:/data
    depends_on:
      postgres:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
      migrator:
        condition: service_completed_successfully
  crawler-supervisor:
    build:
      context: ../..
      dockerfile: Dockerfile
    profiles: ["data"]
    command: ["python", "-m", "src.craftly.learning.supervisor"]
    environment:
      CRAFTLY_DATABASE_URL: "postgresql://craftly:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/craftly"
      CRAFTLY_DATA_SOURCES: "config/data_sources.ultimate.json"
      CRAFTLY_RAW_OUTPUT_DIR: "/data/raw"
      CRAFTLY_CLEAN_OUTPUT_DIR: "/data/clean"
      CRAFTLY_OBJECT_STORE_URI: "s3://craftly-datasets/pretraining"
      CRAFTLY_ASYNC_WORKERS: "32"
      CRAFTLY_WORKER_REPLICAS: "4"
      CRAFTLY_BATCH_DOCS: "10000"
      AWS_ACCESS_KEY_ID: "${MINIO_ROOT_USER:?set MINIO_ROOT_USER}"
      AWS_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}"
      AWS_EC2_METADATA_DISABLED: "true"
    volumes:
      - data-artifacts:/data
    depends_on:
      postgres:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
      migrator:
        condition: service_completed_successfully
  rag-worker:
    build:
      context: ../..
      dockerfile: Dockerfile
    profiles: ["rag"]
    command:
      ["python", "-u", "-m", "src.craftly.indexing.repository_indexer", "worker", "--production", "--poll-seconds", "1"]
    restart: unless-stopped
    environment:
      CRAFTLY_ENV: "production"
      CRAFTLY_DATABASE_URL: "postgresql://craftly:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/craftly"
      CRAFTLY_REDIS_URL: "redis://redis:6379/0"
      CRAFTLY_QDRANT_URL: "http://qdrant:6333"
      CRAFTLY_EMBEDDING_URL: "${CRAFTLY_EMBEDDING_URL:?set CRAFTLY_EMBEDDING_URL}"
      CRAFTLY_EMBEDDING_MANIFEST: "/run/craftly/embedding_manifest.json"
      CRAFTLY_EMBEDDING_DIMS: "768"
      CRAFTLY_RAG_OBJECT_STORE_URI: "s3://craftly-datasets/repository-snapshots"
      CRAFTLY_OBJECT_STORE_ENDPOINT_URL: "http://minio:9000"
      AWS_ACCESS_KEY_ID: "${MINIO_ROOT_USER:?set MINIO_ROOT_USER}"
      AWS_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}"
      AWS_EC2_METADATA_DISABLED: "true"
    volumes:
      - "${CRAFTLY_EMBEDDING_MANIFEST_HOST:?set CRAFTLY_EMBEDDING_MANIFEST_HOST}:/run/craftly/embedding_manifest.json:ro"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio-bootstrap:
        condition: service_completed_successfully
      migrator:
        condition: service_completed_successfully
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["monitoring"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      api:
        condition: service_healthy
      alertmanager:
        condition: service_started
  alertmanager:
    image: prom/alertmanager:v0.28.1
    profiles: ["monitoring"]
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
  grafana:
    image: grafana/grafana:11.3.1
    profiles: ["monitoring"]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-dashboard.json:/var/lib/grafana/dashboards/craftly.json:ro
    depends_on:
      - prometheus
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    profiles: ["monitoring"]
    command: ["--config=/etc/otel-collector.yaml"]
    ports:
      - "4318:4318"
      - "127.0.0.1:13133:13133"
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml:ro
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: craftly
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
      POSTGRES_DB: craftly
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U craftly -d craftly"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?set MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
  minio-bootstrap:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    profiles: ["data", "training", "rag"]
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - |
        until mc alias set craftly http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do sleep 2; done
        mc mb --ignore-existing craftly/craftly-datasets
        mc anonymous set none craftly/craftly-datasets
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?set MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}"

volumes:
  postgres-data:
  redis-data:
  minio-data:
  data-artifacts:
  prometheus-data:
  grafana-data:
  qdrant-data:
  training-runtime:
  alertmanager-data:

