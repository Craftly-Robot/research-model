groups:
  - name: craftly-production
    rules:
      - alert: CraftlyApiServerErrors
        expr: sum(rate(craftly_http_server_errors_total[5m])) > 0
        for: 2m
        labels:
          severity: critical
          service: craftly-api
        annotations:
          summary: Craftly API is returning server errors

      - alert: CraftlyTrainingWorkerHeartbeatMissing
        expr: max(craftly_training_worker_heartbeat_age_seconds) > 30
        for: 2m
        labels:
          severity: critical
          service: craftly-training
        annotations:
          summary: Craftly training worker heartbeat is stale

      - alert: CraftlyTrainingEventBacklog
        expr: max(craftly_training_event_backlog) > 10000
        for: 5m
        labels:
          severity: warning
          service: craftly-training
        annotations:
          summary: Craftly training event backlog is excessive

      - alert: CraftlyGenerationQueueSaturated
        expr: max(craftly_serving_queue_depth) >= 64
        for: 2m
        labels:
          severity: warning
          service: craftly-serving
        annotations:
          summary: Craftly native serving queue is saturated
