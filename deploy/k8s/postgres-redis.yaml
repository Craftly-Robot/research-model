apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: craftly-postgres
spec:
  serviceName: craftly-postgres
  replicas: 1
  selector:
    matchLabels:
      app: craftly-postgres
  template:
    metadata:
      labels:
        app: craftly-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_USER
              value: craftly
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: craftly-secrets
                  key: postgres-password
            - name: POSTGRES_DB
              value: craftly
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 500Gi
---
apiVersion: v1
kind: Service
metadata:
  name: craftly-postgres
spec:
  selector:
    app: craftly-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: craftly-redis
spec:
  serviceName: craftly-redis
  replicas: 1
  selector:
    matchLabels:
      app: craftly-redis
  template:
    metadata:
      labels:
        app: craftly-redis
    spec:
      containers:
        - name: redis
          image: redis:7
          command:
            - /bin/sh
            - -ec
            - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$REDIS_PASSWORD"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: craftly-secrets
                  key: redis-password
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["/bin/sh", "-ec", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping | grep -qx PONG"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["/bin/sh", "-ec", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping | grep -qx PONG"]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: redis-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Gi
---
apiVersion: v1
kind: Service
metadata:
  name: craftly-redis
spec:
  selector:
    app: craftly-redis
  ports:
    - port: 6379
      targetPort: 6379

