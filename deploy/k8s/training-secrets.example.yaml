apiVersion: v1
kind: Secret
metadata:
  name: craftly-training-secrets
  namespace: craftly-training
type: Opaque
stringData:
  jwt-secret: "replace-with-64-plus-random-chars"
  database-url: "postgresql://craftly:replace-with-password@craftly-postgres.default.svc.cluster.local:5432/craftly"
  redis-url: "redis://:replace-with-redis-password@craftly-redis.default.svc.cluster.local:6379/0"
  object-store-endpoint: "http://craftly-minio.default.svc.cluster.local:9000"
  object-store-access-key: "replace-with-minio-access-key"
  object-store-secret-key: "replace-with-minio-secret-key"
---
apiVersion: v1
kind: Secret
metadata:
  name: craftly-training-runtime
  namespace: craftly-training
type: Opaque
stringData:
  CRAFTLY_DATABASE_URL: "postgresql://craftly:replace-with-password@craftly-postgres.default.svc.cluster.local:5432/craftly"
  CRAFTLY_REDIS_URL: "redis://:replace-with-redis-password@craftly-redis.default.svc.cluster.local:6379/0"
  CRAFTLY_OBJECT_STORE_URI: "s3://craftly-datasets/training-workspace"
  CRAFTLY_OBJECT_STORE_ENDPOINT_URL: "http://craftly-minio.default.svc.cluster.local:9000"
  AWS_ACCESS_KEY_ID: "replace-with-workload-scoped-access-key"
  AWS_SECRET_ACCESS_KEY: "replace-with-workload-scoped-secret-key"
  AWS_EC2_METADATA_DISABLED: "true"
